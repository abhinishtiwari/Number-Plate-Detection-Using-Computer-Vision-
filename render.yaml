# Render blueprint - serves both the dashboard and the API from one service.
services:
  - type: web
    name: number-plate-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SERVE_FRONTEND
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ONNXRUNTIME_NUM_THREADS
        value: "1"
      - key: VIDEO_FRAME_STRIDE
        value: "15"
      - key: VIDEO_MAX_FRAMES_SCANNED
        value: "150"
      - key: PYTHON_VERSION
        value: "3.12.3"
