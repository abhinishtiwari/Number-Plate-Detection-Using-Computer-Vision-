<svg xmlns="http://www.w3.org/2000/svg" width="430" height="110" viewBox="0 0 430 110" role="img" aria-labelledby="title desc">
  <title id="title">Number Plate AI logo</title>
  <desc id="desc">A scanning frame around an Indian number plate beside the Number Plate AI wordmark</desc>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="430" height="110" rx="18" fill="#071426"/>
  <g transform="translate(8 12)">
