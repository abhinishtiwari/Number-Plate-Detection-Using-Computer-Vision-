# Publishes the frontend/ folder to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No gh-pages branch is needed.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the API URL was not configured
        run: |
          if grep -qE 'NUMBER_PLATE_API_URL\s*=\s*""' frontend/config.js; then
            echo "::error file=frontend/config.js::Set NUMBER_PLATE_API_URL to your Render URL before deploying."
            echo "The dashboard cannot call an API on github.io, which only serves static files."
            exit 1
          fi
          echo "API URL is set:"
          grep NUMBER_PLATE_API_URL frontend/config.js

      - uses: actions/configure-pages@v5

      - name: Upload frontend/
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
